[package]
name = "pico_tcon"
version = "0.1.0"
edition = "2021"

# Disable the implicit test/bench harness. It pulls in the std-only `test`
# crate, which doesn't exist for the no_std thumbv6m target — that's what makes
# RustRover flag "can't find crate for `test`" on the #![no_std] line.
[[bin]]
name = "pico_tcon"
path = "src/main.rs"
test = false
bench = false

[dependencies]
# Async runtime + the #[embassy_executor::main] entry-point attribute.
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }

# Chip HAL for the RP2040: GPIO, PIO, clocks, the boot2 bootloader, etc.
embassy-rp = { version = "0.10.0", features = ["rp2040", "time-driver", "critical-section-impl"] }

# embassy-rp's "time-driver" implements the clock for this crate; required.
embassy-time = "0.5.1"

# USB device stack (enumeration, CDC-ACM virtual serial port) on top of the RP2040's USB controller.
embassy-usb = "0.6.0"

# Async channel (encoder tasks -> USB task) and select() for waiting on two pins at once.
embassy-sync = "0.8.0"
embassy-futures = "0.1.2"

# One-time-initialised statics for the USB descriptor buffers (they must live forever).
static_cell = "2"

# Cortex-M0+ has no atomic compare-and-swap; emulate it with a critical section (needed by static_cell).
portable-atomic = { version = "1", features = ["critical-section"] }

# ARM Cortex-M core support: startup code, vector table, the reset handler.
cortex-m = { version = "0.7.6", features = ["inline-asm"] }
cortex-m-rt = "0.7.0"

[profile.release]
debug = true        # keep symbols (no runtime cost) for inspection
opt-level = "s"     # optimize for small code size
